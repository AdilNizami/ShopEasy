[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "services/catalog",
    "services/orders",
    "services/payments",
    "services/inventory",
    "services/notifications",
    "services/gateway",
    "services/auth",
    "services/common",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
extraPaths = [
    "services/catalog",
    "services/orders",
    "services/payments",
    "services/inventory",
    "services/notifications",
    "services/gateway",
    "services/auth",
    "services/common",
]
reportMissingImports = "none"
